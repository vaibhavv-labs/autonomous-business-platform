[theme]
primaryColor = "#6366f1"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#161c2d"
textColor = "#f1f5f9"
font = "sans serif"

[server]
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 200
headless = true

[client]
showErrorDetails = true
toolbarMode = "minimal"

[runner]
fastReruns = true
