[build]
builder = "nixpacks"

[build.nixpacksPlan.phases.install]
dependsOn = ["setup"]
cmds = ["pip install -r requirements_railway.txt"]

[deploy]
startCommand = "uvicorn api_server:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5

[deploy.healthcheck]
path = "/health"
timeout = 30
